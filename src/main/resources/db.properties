# ==============================================================
# Homecenter Envíos - Parámetros de conexión (los usa Hibernate)
# Autores: Juan Luis Torres Leal y Angela María Constain Escobar
#
# Ajuste usuario y contraseña a los de su servidor MySQL local.
# También pueden sobrescribirse con las variables de entorno
# HC_DB_URL, HC_DB_USUARIO y HC_DB_CONTRASENA.
# ==============================================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/homecenter_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota
db.usuario=root
db.contrasena=Cuarzo02$10072l

# Número máximo de conexiones simultáneas del pool HikariCP
db.pool.maximo=10

# Qué hace Hibernate con las tablas al arrancar:
#   none     -> nada (recomendado: las tablas las crea database/homecenter_db.sql)
#   validate -> verifica que las entidades coincidan con las tablas
hibernate.esquema=none

# true = imprime en la consola de Tomcat cada sentencia SQL generada por Hibernate
hibernate.mostrar_sql=false
